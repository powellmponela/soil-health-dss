version: '3.8'
name: 'soil-health'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: soil_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
